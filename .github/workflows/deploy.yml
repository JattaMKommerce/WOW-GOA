name: Deploy to cPanel

on:
  push:
    branches:
      - main
      - feature/implementation
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy to cPanel (SFTP)
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: 🗂️ Prepare Deployment Files
        run: |
          mkdir -p deploy_dir
          # Copy built frontend
          cp -r frontend/dist/* deploy_dir/
          # Copy .htaccess
          if [ -f .htaccess ]; then cp .htaccess deploy_dir/; fi
          # Copy backend files
          mkdir -p deploy_dir/backend
          cp -r backend/* deploy_dir/backend/
          # Remove local test / sqlite / large files
          rm -f deploy_dir/backend/database.sqlite
          rm -f deploy_dir/backend/*.log
          rm -f deploy_dir/backend/*.zip
          rm -f deploy_dir/backend/test_*.php

      - name: 🚀 Sync Files to cPanel via Secure SFTP (Port 22)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          port: '22'
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          local_path: './deploy_dir/*'
          remote_path: '/home/wowgoa/public_html/'
          sftpArgs: '-o ConnectTimeout=30'
